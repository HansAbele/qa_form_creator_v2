services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: qa-form-creator:${IMAGE_TAG:-latest}
    container_name: qa_form_creator_app
    restart: unless-stopped
    ports:
      - "${QORE_BIND_ADDRESS:-127.0.0.1}:${QORE_HTTP_PORT:-3000}:3000"
    mem_limit: ${QORE_APP_MEMORY_LIMIT:-1536m}
    cpus: ${QORE_APP_CPU_LIMIT:-2.0}
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - DATABASE_URL=postgresql://${DB_APP_USER:-qa_app}:${DB_APP_PASSWORD:?DB_APP_PASSWORD is required}@db:5432/qa_form_creator
      - AUTH_SECRET=${AUTH_SECRET:?AUTH_SECRET is required}
      - RATE_LIMIT_HASH_SECRET=${RATE_LIMIT_HASH_SECRET:?RATE_LIMIT_HASH_SECRET is required}
      - AUTH_URL=${AUTH_URL:?AUTH_URL is required}
      - AUTH_TRUST_HOST=true
      - NODE_ENV=production
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - OPERATIONAL_TIME_ZONE=${OPERATIONAL_TIME_ZONE:?OPERATIONAL_TIME_ZONE is required}
      - RECORDING_STORAGE_ROOT=/var/lib/qore/recordings
      - MAX_RECORDING_BYTES=${MAX_RECORDING_BYTES:-262144000}
      - NICE_CXONE_TOKEN_URL=${NICE_CXONE_TOKEN_URL:-}
      - NICE_CXONE_ACCESS_KEY_ID=${NICE_CXONE_ACCESS_KEY_ID:-}
      - NICE_CXONE_ACCESS_KEY_SECRET=${NICE_CXONE_ACCESS_KEY_SECRET:-}
      - NICE_CXONE_API_BASE_URL=${NICE_CXONE_API_BASE_URL:-}
      - NICE_CXONE_MEDIA_BASE_URL=${NICE_CXONE_MEDIA_BASE_URL:-}
      - NICE_CXONE_INSTANCE_KEY=${NICE_CXONE_INSTANCE_KEY:-hapusa}
      - NICE_CXONE_SCOPE_FIELD=${NICE_CXONE_SCOPE_FIELD:-campaign}
      - NICE_CXONE_PAGE_SIZE=${NICE_CXONE_PAGE_SIZE:-1000}
      - FREEPBX_INSTANCE_KEY=${FREEPBX_INSTANCE_KEY:-parker-davis}
      - FREEPBX_BASE_URL=${FREEPBX_BASE_URL:-https://pbx.pdhvac.com/}
      - FREEPBX_ALLOWED_HOSTS=${FREEPBX_ALLOWED_HOSTS:-pbx.pdhvac.com}
      - FREEPBX_USERNAME=${FREEPBX_USERNAME:-}
      - FREEPBX_PASSWORD=${FREEPBX_PASSWORD:-}
      - FREEPBX_TIME_ZONE=${FREEPBX_TIME_ZONE:-America/New_York}
      - FREEPBX_CDR_PAGE_SIZE=${FREEPBX_CDR_PAGE_SIZE:-5000}
      - NVIDIA_NIM_API_KEY=${NVIDIA_NIM_API_KEY:-}
      - NVIDIA_NIM_API_KEY_II=${NVIDIA_NIM_API_KEY_II:-}
      - NVIDIA_NIM_TRANSCRIPTION_URL=${NVIDIA_NIM_TRANSCRIPTION_URL:-https://1598d209-5e27-4d3c-8079-4751568b1081.invocation.api.nvcf.nvidia.com/v1/audio/transcriptions}
      - NVIDIA_NIM_TRANSCRIPTION_MODEL=${NVIDIA_NIM_TRANSCRIPTION_MODEL:-parakeet-ctc-1.1b-asr}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_API_KEY_II=${GROQ_API_KEY_II:-}
      - GROQ_TRANSCRIPTION_URL=${GROQ_TRANSCRIPTION_URL:-https://api.groq.com/openai/v1/audio/transcriptions}
      - GROQ_TRANSCRIPTION_MODEL=${GROQ_TRANSCRIPTION_MODEL:-whisper-large-v3}
      - TRANSCRIPTION_PROVIDER_ORDER=${TRANSCRIPTION_PROVIDER_ORDER:-NVIDIA_NIM,GROQ}
      - TRANSCRIPTION_LANGUAGE=${TRANSCRIPTION_LANGUAGE:-en}
      - TRANSCRIPTION_REQUEST_TIMEOUT_MS=${TRANSCRIPTION_REQUEST_TIMEOUT_MS:-300000}
      - TRANSCRIPTION_MAX_AUDIO_BYTES=${TRANSCRIPTION_MAX_AUDIO_BYTES:-25165824}
      - FFMPEG_PATH=${FFMPEG_PATH:-ffmpeg}
      - FFPROBE_PATH=${FFPROBE_PATH:-ffprobe}
      - TRANSCRIPTION_WORKER_ENABLED=${TRANSCRIPTION_WORKER_ENABLED:-true}
      - TRANSCRIPTION_WORKER_POLL_MS=${TRANSCRIPTION_WORKER_POLL_MS:-5000}
      - TRANSCRIPTION_JOB_MAX_ATTEMPTS=${TRANSCRIPTION_JOB_MAX_ATTEMPTS:-3}
      - TRANSCRIPTION_JOB_LEASE_MS=${TRANSCRIPTION_JOB_LEASE_MS:-2700000}
      - EXPORT_MAX_EVALUATIONS=${EXPORT_MAX_EVALUATIONS:-1000}
      - EXPORT_MAX_ANSWER_ROWS=${EXPORT_MAX_ANSWER_ROWS:-10000}
      - EXPORT_MAX_QUESTION_COLUMNS=${EXPORT_MAX_QUESTION_COLUMNS:-100}
      - EXPORT_MAX_CELLS=${EXPORT_MAX_CELLS:-100000}
      - EXPORT_MAX_TEXT_BYTES=${EXPORT_MAX_TEXT_BYTES:-8000000}
      - EXPORT_MAX_REQUESTS_PER_MINUTE=${EXPORT_MAX_REQUESTS_PER_MINUTE:-4}
      - EXPORT_MAX_CONCURRENT_PER_USER=${EXPORT_MAX_CONCURRENT_PER_USER:-1}
      - EXPORT_MAX_CONCURRENT_GLOBAL=${EXPORT_MAX_CONCURRENT_GLOBAL:-2}
      - EXPORT_LEASE_TIMEOUT_SECONDS=${EXPORT_LEASE_TIMEOUT_SECONDS:-900}
      - OBSERVABILITY_SERVICE_NAME=${OBSERVABILITY_SERVICE_NAME:-qore-production}
      - ERROR_REPORTING_WEBHOOK_URL=${ERROR_REPORTING_WEBHOOK_URL:-}
      - ERROR_REPORTING_WEBHOOK_TOKEN=${ERROR_REPORTING_WEBHOOK_TOKEN:-}
    volumes:
      - recordings:/var/lib/qore/recordings
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  db:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    container_name: qa_form_creator_db
    restart: unless-stopped
    mem_limit: ${QORE_DB_MEMORY_LIMIT:-768m}
    cpus: ${QORE_DB_CPU_LIMIT:-1.5}
    shm_size: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_USER: ${DB_OWNER_USER:-qa_owner}
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD:?DB_OWNER_PASSWORD is required}
      POSTGRES_DB: qa_form_creator
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_OWNER_USER:-qa_owner} -d qa_form_creator"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrator:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    image: qa-form-creator-migrator:${IMAGE_TAG:-latest}
    profiles: ["tools"]
    environment:
      - DATABASE_URL=postgresql://${DB_OWNER_USER:-qa_owner}:${DB_OWNER_PASSWORD:?DB_OWNER_PASSWORD is required}@db:5432/qa_form_creator
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  recordings:
